<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harbor Local</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div id="app" class="shell">
      <aside class="sidebar" aria-label="Primary">
        <div class="brand">
          <div class="brand-mark">H</div>
          <div>
            <strong>Harbor Local</strong>
            <span>MCP console</span>
          </div>
        </div>
        <nav class="nav" aria-label="Pages">
          <a href="#overview" data-nav="overview">Overview</a>
          <a href="#plugins" data-nav="plugins">Plugins</a>
          <a href="#traces" data-nav="traces">Traces</a>
        </nav>
        <div class="sidebar-foot">
          <span id="runtime-status" class="status-dot muted">Checking</span>
          <small id="project-root">Project state</small>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Local runtime</p>
            <h1 id="page-title">Overview</h1>
          </div>
          <div class="topbar-actions">
            <button id="refresh-all" class="button secondary" type="button">Refresh</button>
          </div>
        </header>
        <div id="notice" class="notice" hidden></div>
        <section id="view" class="view" aria-live="polite"></section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
