[project]
name = "harbor-sdk"
version = "0.1.1"
description = "Python client SDK for the Harbor control plane."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27", "pydantic>=2.7"]
keywords = ["harbor", "hrbr", "mcp", "sdk", "api-client"]

[[project.authors]]
name = "Zonko Team"

[project.urls]
Homepage = "https://github.com/zonko-ai/harbor-sdk#readme"
Repository = "https://github.com/zonko-ai/harbor-sdk"
Issues = "https://github.com/zonko-ai/harbor-sdk/issues"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_sdk", "harbor_sdk_generated"]
